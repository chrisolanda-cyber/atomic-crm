name: 🚀 Deploy
on:
    push:
        branches:
            - main
    workflow_dispatch:

# Never cancel a deploy halfway through a push to gh-pages; queue the next one instead.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write

# Builds the CRM front end and publishes it to the gh-pages branch of this repository,
# the same result as running `npm run build && npm run ghpages:deploy` locally.
# Supabase migrations and edge functions are deliberately NOT deployed from here:
# they stay a manual `make supabase-deploy` against the live project.
jobs:
    deploy-app:
        name: 🚀 Deploy (app)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SB_PUBLISHABLE_KEY: ${{ secrets.SB_PUBLISHABLE_KEY }}

        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            # gh-pages pushes from its own clone, which does not inherit checkout's auth header.
            - name: ⚙️ Setup git
              run: |
                  git remote set-url origin "https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}"
                  git config --global user.email support+actions@github.com
                  git config --global user.name github-actions-bot

            - name: 🔐 Check secrets
              run: |
                  if [ -z "$SUPABASE_URL" ] || [ -z "$SB_PUBLISHABLE_KEY" ]; then
                    echo "::error::Set the SUPABASE_URL and SB_PUBLISHABLE_KEY repository secrets before deploying."
                    exit 1
                  fi

            # Same file the local build reads, so the bundle is configured identically.
            - name: ⚙️ Write production env
              run: |
                  printf 'VITE_SUPABASE_URL=%s\nVITE_SB_PUBLISHABLE_KEY=%s\n' \
                    "$SUPABASE_URL" "$SB_PUBLISHABLE_KEY" > .env.production.local

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build

            - name: 📡 Deploy GitHub pages
              run: |
                  npx gh-pages -d dist -b gh-pages --nojekyll \
                    -u "github-actions-bot <support+actions@github.com>" \
                    -m "Deploy ${GITHUB_SHA::7}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
